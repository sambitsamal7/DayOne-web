<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG — Turn Productivity into Fantasy Progression</title>
    
    <!-- Google Fonts: Orbitron for Sci-Fi HUD titles & Plus Jakarta Sans for UI text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-container" class="card auth-card">
        <div class="auth-header">
            <svg class="hud-icon-cyan" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M14.5 3.5 L20.5 9.5 L11 19 L5 19 L5 13 Z"/>
                <path d="M9 15 L4 20 M15 9 L18 6"/>
            </svg>
            <h1 class="glitch-title">Life RPG</h1>
            <p class="subtitle">Turn daily productivity into an immersive fantasy progression engine</p>
        </div>

        <form id="auth-form">
            <div class="input-group">
                <input type="email" id="auth-email" placeholder="Hero Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" placeholder="Passcode (min 6 chars)" required>
            </div>
            <button type="button" id="btn-login" class="btn btn-primary">LOG IN</button>
            <button type="button" id="btn-signup" class="btn btn-secondary">SIGN UP NEW HERO</button>
        </form>
    </div>

    <!-- MAIN GAME DASHBOARD CONTAINER -->
    <div id="game-dashboard" class="dashboard-layout hidden">
        
        <!-- HEADER / HERO STATUS BANNER -->
        <header class="hud-header card">
            <div class="hero-identity">
                <h2 id="hero-email" class="hero-title">HERO PROFILE</h2>
                <span id="hero-title-badge" class="badge">Shadow Initiate</span>
            </div>

            <div class="hero-stats-bar">
                <!-- Level Pill -->
                <div class="stat-pill">
                    <span class="pill-label">LEVEL</span>
                    <span id="stats-level" class="pill-value">1</span>
                </div>

                <!-- XP Bar -->
                <div class="xp-section">
                    <div class="xp-labels">
                        <span>XP PROGRESS</span>
                        <span id="xp-text">0 / 100</span>
                    </div>
                    <div class="xp-bar-track"></div>
                </div>

                <!-- Gold Pill -->
                <div class="stat-pill gold-pill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="8"/>
                        <path d="M12 8v8M9.5 10h5M9.5 14h5"/>
                    </svg>
                    <span id="stats-gold" class="pill-value">0</span>
                </div>
                
                <button id="btn-logout" class="btn btn-small">LOGOUT</button>
            </div>
        </header>

        <!-- MAIN CONTENT GRID -->
        <main class="grid-container">
            
            <!-- COLUMN 1: QUEST SYSTEM -->
            <section class="card quest-section">
                <div class="section-title">
                    <!-- Inline Sword SVG Icon -->
                    <svg class="hud-icon-cyan" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M14.5 3.5 L20.5 9.5 L11 19 L5 19 L5 13 Z"/>
                        <path d="M9 15 L4 20 M15 9 L18 6"/>
                    </svg>
                    <h3>Active Quests</h3>
                </div>

                <!-- Create Quest Form -->
                <form id="quest-form" class="quest-input-row">
                    <input type="text" id="quest-title" placeholder="Enter quest objective..." required>
                    <select id="quest-attribute">
                        <option value="STR">STR (+XP)</option>
                        <option value="INT">INT (+XP)</option>
                    </select>
                    <button type="submit" class="btn btn-accent">+ ADD QUEST</button>
                </form>

                <!-- Quests List -->
                <ul id="quest-list" class="quest-list">
                    <!-- Dynamic quests inject here -->
                </ul>
            </section>

            <!-- COLUMN 2: BOSS DUNGEON & ATTRIBUTES -->
            <section class="side-column">
                
                <!-- DUNGEON BOSS CARD -->
                <div class="card boss-card">
                    <div class="section-title">
                        <!-- Inline Dragon/Boss SVG Mark -->
                        <svg class="hud-icon-gold" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                            <path d="M3 12 C6 6 10 4 14 6 C18 8 20 6 21 4 C21 8 19 11 16 12 C19 13 21 16 21 20 C18 17 14 16 11 17 C7 18 4 17 3 14 Z"/>
                            <circle cx="17" cy="9" r="0.8" fill="currentColor"/>
                        </svg>
                        <h3 class="boss-name">Dungeon Boss: Shadow Drake</h3>
                    </div>
                    <div class="boss-hp-container">
                        <div class="boss-hp-labels">
                            <span>BOSS HEALTH</span>
                            <span id="boss-hp-text">500 / 500</span>
                        </div>
                        <div class="boss-hp-track"></div>
                    </div>
                    <button id="btn-attack-boss" class="btn btn-danger">ATTACK BOSS</button>
                </div>

                <!-- HERO ATTRIBUTES CARD -->
                <div class="card stats-card">
                    <div class="section-title">
                        <!-- Inline Shield SVG Icon -->
                        <svg class="hud-icon-cyan" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z"/>
                        </svg>
                        <h3>Hero Attributes</h3>
                    </div>
                    <div class="attributes-grid">
                        <div class="attr-box">
                            <span class="attr-name">STRENGTH (STR)</span>
                            <span id="attr-str" class="attr-val">10</span>
                        </div>
                        <div class="attr-box">
                            <span class="attr-name">INTELLECT (INT)</span>
                            <span id="attr-int" class="attr-val">10</span>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- Application JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
